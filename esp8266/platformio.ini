[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200

lib_deps = 
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    claws/BH1750 @ ^1.3.0

; Optional sensors: set to 0 the ones that are not installed.
build_flags =
    -D USE_LIGHT_SENSOR=1
    -D USE_DOOR_SWITCH=1
    -D USE_WINDOW_SWITCH=1
